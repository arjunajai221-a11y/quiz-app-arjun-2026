
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="quiz-container">
        <h1>Quiz Application</h1>
        <p class="subtitle">Test your knowledge!</p>

        <div id="quiz-box">
            <div class="quiz-header">
                <span id="question-number">Question 1 of 10</span>
                <span id="score">Score: 0</span>
            </div>

            <div class="progress-bar">
                <div id="progress"></div>
            </div>

            <h2 id="question">Question appears here</h2>

            <div id="answer-buttons">
                <button class="answer-btn">Option A</button>
                <button class="answer-btn">Option B</button>
                <button class="answer-btn">Option C</button>
                <button class="answer-btn">Option D</button>
            </div>

            <button id="next-btn">Next Question</button>
        </div>

        <div id="result-box" class="hidden">
            <h2>Quiz Completed!</h2>
            <p id="final-score"></p>
            <button id="restart-btn">Restart Quiz</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
